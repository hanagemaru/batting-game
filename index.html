<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0d12"><title>BATTER'S READ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080a0e;color:#eef2f3;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;touch-action:none}body{display:flex;justify-content:center}.app{width:min(100%,560px);height:100dvh;display:grid;grid-template-rows:66px 1fr 32px;background:radial-gradient(circle at 50% 10%,#26313a 0,#111820 35%,#080a0e 78%)}header{display:grid;grid-template-columns:80px 1fr 90px;align-items:end;padding:max(10px,env(safe-area-inset-top)) 12px 9px;border-bottom:1px solid #2a3541;background:#090c10dd;z-index:3}.label{font-size:9px;letter-spacing:.16em;color:#8996a5}.value{font-size:19px;font-weight:900;margin-top:2px}.center{text-align:center}.title{font-size:12px;font-weight:1000;letter-spacing:.12em}.mix{font-size:8px;color:#788595;margin-top:4px}.right{text-align:right}.game{position:relative;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block}.badge{position:absolute;top:11px;left:50%;transform:translateX(-50%);padding:5px 9px;border:1px solid #3a4655;background:#090d12dd;font-size:10px;font-weight:900;letter-spacing:.12em;opacity:0}.badge.on{opacity:1}.result{position:absolute;top:21%;left:50%;transform:translate(-50%,-50%) scale(.94);font-size:42px;font-weight:1000;letter-spacing:-.06em;text-shadow:0 3px 0 #000;opacity:0;text-align:center;pointer-events:none}.result.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.result small{display:block;font-size:10px;letter-spacing:.12em;margin-top:5px}.meters{position:absolute;left:10px;right:10px;bottom:9px;background:#090d12dd;border:1px solid #3a4655;padding:8px 9px;display:grid;gap:5px}.row{display:grid;grid-template-columns:58px 1fr;gap:7px;align-items:center;font-size:8px;color:#aab3bd}.track{height:6px;background:#080b10;border:1px solid #35404d}.fill{height:100%;width:0}.contact{background:#87e9b2}.power{background:#f5d45b}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#05070adb;backdrop-filter:blur(3px);opacity:0;pointer-events:none;z-index:5}.overlay.show{opacity:1;pointer-events:auto}.card{width:min(100%,410px);padding:20px 17px;border:1px solid #465364;background:linear-gradient(#18212a,#10161d);box-shadow:7px 7px 0 #020304}.eyebrow{font-size:9px;color:#f5d45b;letter-spacing:.18em;font-weight:900}.card h1{font-size:clamp(23px,7vw,33px);line-height:1.17;letter-spacing:-.05em;margin:9px 0 11px}.card p{font:12px/1.75 system-ui,sans-serif;color:#b2bcc7;margin:0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.chips span{border:1px solid #4a5664;padding:6px 7px;font-size:8px}.card button{width:100%;min-height:48px;border:1px solid #fff0a9;background:#f5d45b;color:#16140d;font:900 13px ui-monospace,monospace;letter-spacing:.14em;box-shadow:4px 4px 0 #020304}.end{text-align:center}.end h2{font-size:52px;margin:8px 0 5px}footer{display:flex;align-items:center;justify-content:center;gap:11px;border-top:1px solid #202833;color:#667281;font-size:8px;padding-bottom:env(safe-area-inset-bottom)}@media(max-height:650px){.app{grid-template-rows:56px 1fr 0}footer{display:none}.card{padding:15px}.card h1{font-size:23px}}
</style></head>
<body><div class="app">
<header><div><div class="label">PITCH</div><div class="value"><span id="pitchNo">1</span><span style="font-size:12px;color:#687483">/20</span></div></div><div class="center"><div class="title">BATTER'S READ</div><div class="mix">FAST 55 · CURVE 30 · FORK 15</div></div><div class="right"><div class="label">SCORE</div><div class="value" id="score">0000</div></div></header>
<section class="game" id="game"><canvas id="c"></canvas><div class="badge" id="badge">READY</div><div class="result" id="result"></div><div class="meters"><div class="row"><span>CONTACT</span><div class="track"><div class="fill contact" id="cm"></div></div></div><div class="row"><span>POWER</span><div class="track"><div class="fill power" id="pm"></div></div></div></div>
<div class="overlay show" id="start"><div class="card"><div class="eyebrow">20 PITCH CHALLENGE</div><h1>読むほど当てやすい。<br>決め打つほど飛ぶ。</h1><p>球の位置をタップ。押している間は狙いを動かせて、ミート範囲が広がります。待つほどパワーは低下。指を離した瞬間にスイングします。</p><div class="chips"><span>BATTER POV</span><span>QUICK TAP = POWER</span><span>HOLD = CONTACT</span></div><button id="startBtn">START</button></div></div>
<div class="overlay" id="end"><div class="card end"><div class="eyebrow">GAME SET</div><h2 id="final">0000</h2><p id="msg">20球終了</p><br><button id="again">PLAY AGAIN</button></div></div></section><footer><span>タップで狙う</span><span>ドラッグで修正</span><span>離してスイング</span></footer>
</div><script>
(function(){'use strict';
const TOTAL=20,HOLD=850,R0=15,R1=54,P0=1,P1=.34;const c=document.getElementById('c'),x=c.getContext('2d'),g=document.getElementById('game');const q=id=>document.getElementById(id),pitchNo=q('pitchNo'),scoreEl=q('score'),badge=q('badge'),result=q('result'),cm=q('cm'),pm=q('pm'),start=q('start'),end=q('end'),final=q('final'),msg=q('msg');
const types=[{id:'FAST',w:.55,d:820,col:'#f0f3f4'},{id:'CURVE',w:.30,d:930,col:'#9ed8ff'},{id:'FORK',w:.15,d:900,col:'#ffd393'}];let S={phase:'idle',n:0,score:0,pitch:null,t0:0,input:null,next:0,flash:0,shake:0,last:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a);function dims(){const r=g.getBoundingClientRect();return{w:r.width,h:r.height}}function resize(){const d=dims(),r=Math.min(2,devicePixelRatio||1);c.width=Math.round(d.w*r);c.height=Math.round(d.h*r);x.setTransform(r,0,0,r,0,0)}
function zone(){const d=dims(),w=Math.min(d.w*.50,226),h=w*1.16;return{x:d.w*.53-w/2,y:d.h*.36,w,h}}function pick(){let r=Math.random();for(const t of types){r-=t.w;if(r<=0)return t}return types[0]}
function begin(){S={phase:'ready',n:0,score:0,pitch:null,t0:0,input:null,next:0,flash:0,shake:0,last:performance.now()};scoreEl.textContent='0000';pitchNo.textContent='1';start.classList.remove('show');end.classList.remove('show');setTimeout(throwPitch,450)}
function throwPitch(){if(S.n>=TOTAL){finish();return}const z=zone(),d=dims(),t=pick();S.n++;pitchNo.textContent=S.n;S.pitch={type:t,start:{x:d.w*.51+rand(-5,5),y:d.h*.225},target:{x:rand(z.x+z.w*.12,z.x+z.w*.88),y:rand(z.y+z.h*.12,z.y+z.h*.88)},dir:Math.random()<.5?-1:1};S.t0=performance.now();S.phase='pitching';S.input=null;badge.textContent=t.id;badge.classList.add('on');setTimeout(()=>badge.classList.remove('on'),350)}
function pos(now){if(!S.pitch)return null;let t=(now-S.t0)/S.pitch.type.d;let u=clamp(t,0,1),e=u*u;let xx=lerp(S.pitch.start.x,S.pitch.target.x,e),yy=lerp(S.pitch.start.y,S.pitch.target.y,e);if(S.pitch.type.id==='CURVE')xx+=Math.sin(u*Math.PI)*dims().w*.10*S.pitch.dir;if(S.pitch.type.id==='FORK')yy+=Math.pow(u,5)*dims().h*.075;return{x:xx,y:yy,t,scale:.18+1.18*u}}
function stats(now){if(!S.input)return{h:0,r:R0,p:P0};let h=clamp(now-S.input.down,0,HOLD),u=h/HOLD;return{h,r:lerp(R0,R1,Math.pow(u,.7)),p:lerp(P0,P1,Math.pow(u,.9))}}
function down(e){if(S.phase!=='pitching'||S.input)return;e.preventDefault();const r=c.getBoundingClientRect();S.input={id:e.pointerId,down:performance.now(),x:clamp(e.clientX-r.left,0,r.width),y:clamp(e.clientY-r.top,0,r.height)};c.setPointerCapture&&c.setPointerCapture(e.pointerId)}function move(e){if(!S.input||e.pointerId!==S.input.id)return;e.preventDefault();const r=c.getBoundingClientRect();S.input.x=clamp(e.clientX-r.left,0,r.width);S.input.y=clamp(e.clientY-r.top,0,r.height)}function up(e){if(!S.input||e.pointerId!==S.input.id)return;e.preventDefault();swing(performance.now())}
function swing(now){if(S.phase!=='pitching'||!S.input)return;const b=pos(now),st=stats(now),dx=b.x-S.input.x,dy=b.y-S.input.y,dist=Math.hypot(dx,dy),tim=Math.abs(1-b.t),tw=.19,spatial=clamp(1-dist/(st.r+10),0,1),timing=clamp(1-tim/tw,0,1),quality=spatial*timing;let pts=0,label='MISS';if(quality>.77){pts=100;label='PERFECT'}else if(quality>.52){pts=50;label='SOLID'}else if(quality>.28){pts=30;label='CONTACT'}else if(quality>.08){pts=10;label='FOUL'}let power=Math.round(st.p*100);if(pts){S.score+=pts;scoreEl.textContent=String(S.score).padStart(4,'0');S.flash=1;S.shake=pts>=50?6:3;vibe(pts>=100?[30,20,45]:20);tone(true,pts)}else{tone(false,0);vibe(12)}result.innerHTML=label+'<small>'+pts+' PTS · POWER '+power+'</small>';result.classList.add('on');S.phase='result';S.input=null;setTimeout(()=>{result.classList.remove('on');setTimeout(throwPitch,260)},620)}
function noSwing(now){if(S.phase==='pitching'&&S.pitch&&pos(now).t>1.16){result.innerHTML='TAKE<small>0 PTS</small>';result.classList.add('on');S.phase='result';S.input=null;setTimeout(()=>{result.classList.remove('on');setTimeout(throwPitch,260)},500)}}function finish(){S.phase='end';final.textContent=String(S.score).padStart(4,'0');msg.textContent=S.score>=1200?'読みと決め打ちがかなり噛み合っています':S.score>=700?'良い感じ。強振できる球を増やせそうです':'長押しと即振りの使い分けを試してください';end.classList.add('show')}
function draw(now){const d=dims(),z=zone();x.clearRect(0,0,d.w,d.h);
let sky=x.createLinearGradient(0,0,0,d.h*.34);sky.addColorStop(0,'#263744');sky.addColorStop(1,'#111a20');x.fillStyle=sky;x.fillRect(0,0,d.w,d.h*.36);
x.fillStyle='#0a0f13';x.fillRect(0,d.h*.285,d.w,d.h*.075);
x.fillStyle='#121a18';x.beginPath();x.moveTo(0,d.h*.35);x.lineTo(d.w,d.h*.35);x.lineTo(d.w,d.h*.75);x.lineTo(0,d.h*.75);x.closePath();x.fill();
x.fillStyle='#344d3b';x.beginPath();x.moveTo(d.w*.06,d.h*.76);x.lineTo(d.w*.42,d.h*.34);x.lineTo(d.w*.62,d.h*.34);x.lineTo(d.w*.96,d.h*.76);x.closePath();x.fill();
x.fillStyle='#66503c';x.beginPath();x.ellipse(d.w*.51,d.h*.31,d.w*.11,d.h*.025,0,0,Math.PI*2);x.fill();
x.fillStyle='#5d4634';x.beginPath();x.moveTo(d.w*.18,d.h);x.lineTo(d.w*.43,d.h*.62);x.lineTo(d.w*.69,d.h*.62);x.lineTo(d.w*.98,d.h);x.closePath();x.fill();
x.strokeStyle='#d9d3c5aa';x.lineWidth=2;x.beginPath();x.moveTo(d.w*.20,d.h*.98);x.lineTo(d.w*.38,d.h*.61);x.moveTo(d.w*.96,d.h*.98);x.lineTo(d.w*.72,d.h*.61);x.stroke();
x.fillStyle='#ddd7c8';x.beginPath();x.moveTo(d.w*.47,d.h*.73);x.lineTo(d.w*.59,d.h*.73);x.lineTo(d.w*.57,d.h*.77);x.lineTo(d.w*.53,d.h*.79);x.lineTo(d.w*.49,d.h*.77);x.closePath();x.fill();
x.save();x.globalAlpha=.72;x.strokeStyle='#ffffff9a';x.lineWidth=2;x.strokeRect(z.x+.5,z.y+.5,z.w,z.h);x.fillStyle='#ffffff08';x.fillRect(z.x,z.y,z.w,z.h);x.strokeStyle='#ffffff22';x.lineWidth=1;for(let i=1;i<3;i++){x.beginPath();x.moveTo(z.x+z.w*i/3,z.y);x.lineTo(z.x+z.w*i/3,z.y+z.h);x.moveTo(z.x,z.y+z.h*i/3);x.lineTo(z.x+z.w,z.y+z.h*i/3);x.stroke()}x.restore();
pitcher(d.w*.51,d.h*.245);
x.save();x.globalAlpha=.32;x.strokeStyle='#d9c7a1';x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(d.w*.96,d.h*.82);x.lineTo(d.w*.83,d.h*.49);x.stroke();x.strokeStyle='#6f5439';x.lineWidth=5;x.beginPath();x.moveTo(d.w*.955,d.h*.84);x.lineTo(d.w*.925,d.h*.765);x.stroke();x.restore();
if(S.pitch&&S.phase!=='idle'){const b=pos(now);if(b&&b.t<=1.16){x.save();x.globalAlpha=.17;x.fillStyle=S.pitch.type.col;x.beginPath();x.arc(b.x,b.y,10+12*b.scale,0,Math.PI*2);x.fill();x.globalAlpha=1;x.fillStyle=S.pitch.type.col;x.shadowColor='#ffffffaa';x.shadowBlur=9;x.beginPath();x.arc(b.x,b.y,4+8*b.scale,0,Math.PI*2);x.fill();x.shadowBlur=0;x.restore()}}
if(S.input&&S.phase==='pitching'){const st=stats(now);x.strokeStyle='#87e9b2';x.lineWidth=2;x.setLineDash([5,4]);x.beginPath();x.arc(S.input.x,S.input.y,st.r,0,Math.PI*2);x.stroke();x.setLineDash([]);x.strokeStyle='#fff';x.beginPath();x.moveTo(S.input.x-7,S.input.y);x.lineTo(S.input.x+7,S.input.y);x.moveTo(S.input.x,S.input.y-7);x.lineTo(S.input.x,S.input.y+7);x.stroke();cm.style.width=Math.round((st.r-R0)/(R1-R0)*100)+'%';pm.style.width=Math.round(st.p*100)+'%'}else{cm.style.width='0%';pm.style.width='100%'}if(S.flash>0){x.globalAlpha=S.flash*.2;x.fillStyle='#fff4c2';x.fillRect(0,0,d.w,d.h);x.globalAlpha=1;S.flash*=.82}}
function target(a,b,r,t){x.save();x.globalAlpha=.48;x.strokeStyle='#dfc25b';x.lineWidth=2;x.strokeRect(a-r,b-r,r*2,r*2);x.strokeRect(a-r*.55,b-r*.55,r*1.1,r*1.1);x.fillStyle='#ead981';x.font='700 9px monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(t,a,b);x.restore()}function pitcher(a,b){x.fillStyle='#d8dde2';x.fillRect(a-5,b-15,10,8);x.fillStyle='#3e4a57';x.fillRect(a-7,b-7,14,13);x.fillStyle='#d8dde2';x.fillRect(a-10,b-5,5,11);x.fillRect(a+5,b-5,5,11);x.fillStyle='#26313a';x.fillRect(a-6,b+6,5,10);x.fillRect(a+1,b+6,5,10)}function vibe(v){try{navigator.vibrate&&navigator.vibrate(v)}catch(e){}}function tone(hit,pts){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!tone.a)tone.a=new A;const ac=tone.a,o=ac.createOscillator(),gain=ac.createGain();o.type=hit?'square':'sawtooth';o.frequency.value=hit?(pts>=100?220:150):90;gain.gain.value=.035;o.connect(gain);gain.connect(ac.destination);o.start();gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.12);o.stop(ac.currentTime+.13)}catch(e){}}
function loop(now){noSwing(now);x.save();if(S.shake>.2)x.translate(rand(-S.shake,S.shake),rand(-S.shake,S.shake));S.shake*=.82;draw(now);x.restore();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',down,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',up,{passive:false});c.addEventListener('pointercancel',up,{passive:false});q('startBtn').onclick=begin;q('again').onclick=begin;addEventListener('resize',resize);resize();requestAnimationFrame(loop);
})();
</script></body></html>
