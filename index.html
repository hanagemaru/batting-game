<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0d12">
<title>BATTER'S READ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080a0e;color:#eef2f3;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;touch-action:none}body{display:flex;justify-content:center}.app{width:min(100%,560px);height:100dvh;display:grid;grid-template-rows:66px 1fr 32px;background:#080a0e}header{display:grid;grid-template-columns:80px 1fr 90px;align-items:end;padding:max(10px,env(safe-area-inset-top)) 12px 9px;border-bottom:1px solid #2a3541;background:#090c10dd;z-index:3}.label{font-size:9px;letter-spacing:.16em;color:#8996a5}.value{font-size:19px;font-weight:900;margin-top:2px}.center{text-align:center}.title{font-size:12px;font-weight:1000;letter-spacing:.12em}.mix{font-size:8px;color:#788595;margin-top:4px}.right{text-align:right}.game{position:relative;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block}.badge{position:absolute;top:11px;left:50%;transform:translateX(-50%);padding:5px 9px;border:1px solid #3a4655;background:#090d12dd;font-size:10px;font-weight:900;letter-spacing:.12em;opacity:0}.badge.on{opacity:1}.result{position:absolute;top:21%;left:50%;transform:translate(-50%,-50%) scale(.94);font-size:42px;font-weight:1000;letter-spacing:-.06em;text-shadow:0 3px 0 #000;opacity:0;text-align:center;pointer-events:none}.result.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.result small{display:block;font-size:10px;letter-spacing:.12em;margin-top:5px}.meters{position:absolute;left:10px;right:10px;bottom:9px;background:#090d12dd;border:1px solid #3a4655;padding:8px 9px;display:grid;gap:5px}.row{display:grid;grid-template-columns:58px 1fr;gap:7px;align-items:center;font-size:8px;color:#aab3bd}.track{height:6px;background:#080b10;border:1px solid #35404d}.fill{height:100%;width:0}.contact{background:#87e9b2}.power{background:#f5d45b}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#05070adb;backdrop-filter:blur(3px);opacity:0;pointer-events:none;z-index:5}.overlay.show{opacity:1;pointer-events:auto}.card{width:min(100%,410px);padding:20px 17px;border:1px solid #465364;background:linear-gradient(#18212a,#10161d);box-shadow:7px 7px 0 #020304}.eyebrow{font-size:9px;color:#f5d45b;letter-spacing:.18em;font-weight:900}.card h1{font-size:clamp(23px,7vw,33px);line-height:1.17;letter-spacing:-.05em;margin:9px 0 11px}.card p{font:12px/1.75 system-ui,sans-serif;color:#b2bcc7;margin:0}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.chips span{border:1px solid #4a5664;padding:6px 7px;font-size:8px}.card button{width:100%;min-height:48px;border:1px solid #fff0a9;background:#f5d45b;color:#16140d;font:900 13px ui-monospace,monospace;letter-spacing:.14em;box-shadow:4px 4px 0 #020304}.end{text-align:center}.end h2{font-size:52px;margin:8px 0 5px}footer{display:flex;align-items:center;justify-content:center;gap:11px;border-top:1px solid #202833;color:#667281;font-size:8px;padding-bottom:env(safe-area-inset-bottom)}@media(max-height:650px){.app{grid-template-rows:56px 1fr 0}footer{display:none}.card{padding:15px}.card h1{font-size:23px}}
</style>
</head>
<body><div class="app">
<header>
  <div><div class="label">PITCH</div><div class="value"><span id="pitchNo">1</span><span style="font-size:12px;color:#687483">/20</span></div></div>
  <div class="center"><div class="title">BATTER'S READ</div><div class="mix">RIGHT-HANDED BATTER POV</div></div>
  <div class="right"><div class="label">SCORE</div><div class="value" id="score">0000</div></div>
</header>
<section class="game" id="game">
<canvas id="c"></canvas>
<div class="badge" id="badge">READY</div>
<div class="result" id="result"></div>
<div class="meters">
  <div class="row"><span>CONTACT</span><div class="track"><div class="fill contact" id="cm"></div></div></div>
  <div class="row"><span>POWER</span><div class="track"><div class="fill power" id="pm"></div></div></div>
</div>
<div class="overlay show" id="start"><div class="card">
  <div class="eyebrow">20 PITCH CHALLENGE</div>
  <h1>読むほど当てやすい。<br>決め打つほど飛ぶ。</h1>
  <p>右打者の目線から投球を見ます。球の位置をタップし、押している間は狙いを修正できます。待つほどミート範囲は広がりますが、パワーは落ちます。指を離した瞬間にスイング。</p>
  <div class="chips"><span>BATTER EYE CAMERA</span><span>QUICK TAP = POWER</span><span>HOLD = CONTACT</span></div>
  <button id="startBtn">START</button>
</div></div>
<div class="overlay" id="end"><div class="card end"><div class="eyebrow">GAME SET</div><h2 id="final">0000</h2><p id="msg">20球終了</p><br><button id="again">PLAY AGAIN</button></div></div>
</section>
<footer><span>タップで狙う</span><span>ドラッグで修正</span><span>離してスイング</span></footer>
</div>
<script>
(function(){'use strict';
const TOTAL=20,HOLD=850,R0=15,R1=54,P0=1,P1=.34;
const c=document.getElementById('c'),x=c.getContext('2d'),g=document.getElementById('game');
const q=id=>document.getElementById(id),pitchNo=q('pitchNo'),scoreEl=q('score'),badge=q('badge'),result=q('result'),cm=q('cm'),pm=q('pm'),start=q('start'),end=q('end'),final=q('final'),msg=q('msg');
const types=[{id:'FAST',w:.55,d:820,col:'#f0f3f4'},{id:'CURVE',w:.30,d:930,col:'#9ed8ff'},{id:'FORK',w:.15,d:900,col:'#ffd393'}];
let S={phase:'idle',n:0,score:0,pitch:null,t0:0,input:null,flash:0,shake:0};

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const V=(x,y,z)=>({x,y,z});
const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const norm=a=>{const m=Math.hypot(a.x,a.y,a.z)||1;return V(a.x/m,a.y/m,a.z/m)};

function dims(){const r=g.getBoundingClientRect();return{w:r.width,h:r.height}}
function resize(){const d=dims(),r=Math.min(2,devicePixelRatio||1);c.width=Math.round(d.w*r);c.height=Math.round(d.h*r);x.setTransform(r,0,0,r,0,0)}

/* World coordinates:
   x = lateral across plate, y = height, z = distance toward mound.
   Camera is the batter's right-handed eye position, not home-plate center. */
const PLATE_HALF=.2159,PLATE_FRONT=.4318,RUBBER_Z=18.44;
function camera(){
  const d=dims();
  // Same validated coordinate system as debug-3d.html:
  // +Z pitcher, -Z catcher, +X third-base / right-handed batter side.
  const eye=V(.76,1.68,-.62);
  // Batter primarily keys on the release window rather than the plate center.
  const look=V(.18,1.82,16.80);
  const fwd=norm(sub(look,eye));
  const right=norm(cross(V(0,1,0),fwd));
  const up=norm(cross(fwd,right));
  const fov=58*Math.PI/180;
  const focal=(d.h*.5)/Math.tan(fov*.5);
  return{eye,fwd,right,up,focal,cx:d.w*.50,cy:d.h*.48}
}
function project(p){
  const C=camera(),r=sub(p,C.eye),z=dot(r,C.fwd);
  if(z<=.05)return null;
  return{x:C.cx+C.focal*dot(r,C.right)/z,y:C.cy-C.focal*dot(r,C.up)/z,z}
}
function worldZone(){
  // Temporary fixed strike-zone height for the MVP.
  // Width and crossing plane are tied to regulation home-plate geometry.
  return{left:-PLATE_HALF,right:PLATE_HALF,low:.52,high:1.16,z:PLATE_FRONT}
}
function zonePoly(){
  const z=worldZone();
  return[
    project(V(z.left,z.high,z.z)),project(V(z.right,z.high,z.z)),
    project(V(z.right,z.low,z.z)),project(V(z.left,z.low,z.z))
  ];
}
function pick(){let r=Math.random();for(const t of types){r-=t.w;if(r<=0)return t}return types[0]}

function begin(){
  S={phase:'ready',n:0,score:0,pitch:null,t0:0,input:null,flash:0,shake:0};
  scoreEl.textContent='0000';pitchNo.textContent='1';start.classList.remove('show');end.classList.remove('show');
  setTimeout(throwPitch,450)
}
function throwPitch(){
  if(S.n>=TOTAL){finish();return}
  const t=pick(),z=worldZone();
  S.n++;pitchNo.textContent=S.n;
  S.pitch={
    type:t,
    release:V(rand(.08,.28),rand(1.70,1.90),rand(16.55,17.05)),
    target:V(rand(z.left+.05,z.right-.05),rand(z.low+.04,z.high-.04),z.z),
    dir:Math.random()<.5?-1:1
  };
  S.t0=performance.now();S.phase='pitching';S.input=null;
  badge.textContent=t.id;badge.classList.add('on');setTimeout(()=>badge.classList.remove('on'),350)
}
function worldBall(now,overrideT){
  if(!S.pitch)return null;
  let t=overrideT==null?(now-S.t0)/S.pitch.type.d:overrideT;
  const u=clamp(t,0,1),e=u*u*(3-2*u),a=S.pitch.release,b=S.pitch.target;
  let wx=lerp(a.x,b.x,e),wy=lerp(a.y,b.y,e),wz=lerp(a.z,b.z,e);
  // The breaks happen in world space before perspective projection.
  if(S.pitch.type.id==='CURVE')wx+=S.pitch.dir*.30*Math.sin(Math.PI*u)*Math.pow(u,.85);
  if(S.pitch.type.id==='FORK')wy+=.18*Math.sin(Math.PI*u)-.13*Math.sin(Math.PI*u)*Math.pow(u,3);
  // Small gravity-like sag so even FAST does not look ruler-straight.
  wy-=.035*u*u;
  return{p:V(wx,wy,wz),t}
}
function pos(now,overrideT){
  const wb=worldBall(now,overrideT);if(!wb)return null;
  const p=project(wb.p);if(!p)return null;
  return{x:p.x,y:p.y,t:wb.t,depth:p.z}
}
function stats(now){
  if(!S.input)return{h:0,r:R0,p:P0};
  let h=clamp(now-S.input.down,0,HOLD),u=h/HOLD;
  return{h,r:lerp(R0,R1,Math.pow(u,.7)),p:lerp(P0,P1,Math.pow(u,.9))}
}
function down(e){
  if(S.phase!=='pitching'||S.input)return;
  e.preventDefault();const r=c.getBoundingClientRect();
  S.input={id:e.pointerId,down:performance.now(),x:clamp(e.clientX-r.left,0,r.width),y:clamp(e.clientY-r.top,0,r.height)};
  c.setPointerCapture&&c.setPointerCapture(e.pointerId)
}
function move(e){
  if(!S.input||e.pointerId!==S.input.id)return;
  e.preventDefault();const r=c.getBoundingClientRect();
  S.input.x=clamp(e.clientX-r.left,0,r.width);S.input.y=clamp(e.clientY-r.top,0,r.height)
}
function up(e){if(!S.input||e.pointerId!==S.input.id)return;e.preventDefault();swing(performance.now())}

function swing(now){
  if(S.phase!=='pitching'||!S.input)return;
  const b=pos(now),st=stats(now);
  if(!b)return;
  const dist=Math.hypot(b.x-S.input.x,b.y-S.input.y),tim=Math.abs(1-b.t),tw=.19;
  const spatial=clamp(1-dist/(st.r+10),0,1),timing=clamp(1-tim/tw,0,1),quality=spatial*timing;
  let pts=0,label='MISS';
  if(quality>.77){pts=100;label='PERFECT'}else if(quality>.52){pts=50;label='SOLID'}else if(quality>.28){pts=30;label='CONTACT'}else if(quality>.08){pts=10;label='FOUL'}
  const power=Math.round(st.p*100);
  if(pts){S.score+=pts;scoreEl.textContent=String(S.score).padStart(4,'0');S.flash=1;S.shake=pts>=50?6:3;vibe(pts>=100?[30,20,45]:20);tone(true,pts)}else{tone(false,0);vibe(12)}
  result.innerHTML=label+'<small>'+pts+' PTS · POWER '+power+'</small>';result.classList.add('on');S.phase='result';S.input=null;
  setTimeout(()=>{result.classList.remove('on');setTimeout(throwPitch,260)},620)
}
function noSwing(now){
  if(S.phase==='pitching'&&S.pitch&&worldBall(now).t>1.16){
    result.innerHTML='TAKE<small>0 PTS</small>';result.classList.add('on');S.phase='result';S.input=null;
    setTimeout(()=>{result.classList.remove('on');setTimeout(throwPitch,260)},500)
  }
}
function finish(){
  S.phase='end';final.textContent=String(S.score).padStart(4,'0');
  msg.textContent=S.score>=1200?'読みと決め打ちがかなり噛み合っています':S.score>=700?'良い感じ。強振できる球を増やせそうです':'長押しと即振りの使い分けを試してください';
  end.classList.add('show')
}
function path(points,close=false){
  const ps=points.filter(Boolean);if(!ps.length)return;
  x.beginPath();x.moveTo(ps[0].x,ps[0].y);for(let i=1;i<ps.length;i++)x.lineTo(ps[i].x,ps[i].y);if(close)x.closePath()
}
function drawZone(){
  const q=zonePoly();if(q.some(v=>!v))return;
  x.save();x.globalAlpha=.78;x.fillStyle='#ffffff07';path(q,true);x.fill();x.strokeStyle='#ffffff9c';x.lineWidth=2;path(q,true);x.stroke();
  x.strokeStyle='#ffffff25';x.lineWidth=1;
  for(let i=1;i<3;i++){
    const a=i/3;
    const l={x:lerp(q[0].x,q[3].x,a),y:lerp(q[0].y,q[3].y,a)},r={x:lerp(q[1].x,q[2].x,a),y:lerp(q[1].y,q[2].y,a)};
    x.beginPath();x.moveTo(l.x,l.y);x.lineTo(r.x,r.y);x.stroke();
    const t={x:lerp(q[0].x,q[1].x,a),y:lerp(q[0].y,q[1].y,a)},b={x:lerp(q[3].x,q[2].x,a),y:lerp(q[3].y,q[2].y,a)};
    x.beginPath();x.moveTo(t.x,t.y);x.lineTo(b.x,b.y);x.stroke()
  }x.restore()
}
function worldPath(points,fill,stroke,lineWidth=1){
  const ps=points.map(project).filter(Boolean);if(ps.length!==points.length)return;
  x.beginPath();x.moveTo(ps[0].x,ps[0].y);for(let i=1;i<ps.length;i++)x.lineTo(ps[i].x,ps[i].y);x.closePath();
  if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lineWidth;x.stroke()}
}
function worldLine(points,color='#ffffff66',lineWidth=1){
  const ps=points.map(project).filter(Boolean);if(ps.length!==points.length)return;
  x.beginPath();x.moveTo(ps[0].x,ps[0].y);for(let i=1;i<ps.length;i++)x.lineTo(ps[i].x,ps[i].y);
  x.strokeStyle=color;x.lineWidth=lineWidth;x.stroke()
}
function drawField(){
  const d=dims();
  let sky=x.createLinearGradient(0,0,0,d.h);
  sky.addColorStop(0,'#263845');sky.addColorStop(.44,'#10191e');sky.addColorStop(.45,'#263d31');sky.addColorStop(1,'#182b22');
  x.fillStyle=sky;x.fillRect(0,0,d.w,d.h);

  // Perspective ground references. These all use the same world coordinates as the ball.
  worldPath([V(-7,0,1),V(7,0,1),V(8,0,24),V(-8,0,24)],'#294535',null);
  worldLine([V(0,0,0),V(-8,0,24)],'#ece7da55',1.5);
  worldLine([V(0,0,0),V(8,0,24)],'#ece7da55',1.5);

  // Dirt lane toward the mound.
  worldPath([V(-1.25,.006,-.25),V(1.25,.006,-.25),V(1.8,.006,19.3),V(-1.8,.006,19.3)],'#5d4939aa',null);

  // Regulation home plate: rear apex at z=0, 17-inch front edge faces the pitcher.
  worldPath([
    V(-PLATE_HALF,.018,PLATE_FRONT),V(PLATE_HALF,.018,PLATE_FRONT),
    V(PLATE_HALF,.018,PLATE_FRONT/2),V(0,.018,0),V(-PLATE_HALF,.018,PLATE_FRONT/2)
  ],'#e8e5dc','#ffffffaa',1);

  // Right-handed batter's box (+X / third-base side), faint ground reference.
  const bi=PLATE_HALF+.1524,bo=bi+1.2192,bz=PLATE_FRONT/2,bh=.9144;
  worldLine([V(bi,.02,bz-bh),V(bo,.02,bz-bh),V(bo,.02,bz+bh),V(bi,.02,bz+bh),V(bi,.02,bz-bh)],'#e8e2d255',1);

  // Pitcher's rubber and simple mound.
  worldPath([V(-.3048,.018,RUBBER_Z),V(.3048,.018,RUBBER_Z),V(.3048,.018,RUBBER_Z+.1524),V(-.3048,.018,RUBBER_Z+.1524)],'#e8e5dc',null);
  const pit=project(V(0,1.25,RUBBER_Z-.35));
  if(pit)pitcher(pit.x,pit.y);

  // Peripheral hint of a right-handed batter's bat; intentionally subtle.
  x.save();x.globalAlpha=.26;x.strokeStyle='#d0b178';x.lineWidth=8;x.lineCap='round';
  x.beginPath();x.moveTo(d.w*.96,d.h*.94);x.lineTo(d.w*.84,d.h*.61);x.stroke();x.restore()
}
function drawBall(now){
  if(!S.pitch||S.phase==='idle')return;
  const current=worldBall(now);if(!current)return;
  const u=clamp(current.t,0,1);
  // A short perspective trail makes the diagonal approach easier to read.
  for(let i=5;i>=1;i--){
    const tt=Math.max(0,u-i*.025),p=pos(now,tt);if(!p)continue;
    x.globalAlpha=(6-i)*.035;x.fillStyle=S.pitch.type.col;x.beginPath();x.arc(p.x,p.y,2+i*.25,0,Math.PI*2);x.fill()
  }
  x.globalAlpha=1;
  const b=pos(now);if(!b||b.t>1.16)return;
  const radius=clamp(70/Math.max(.45,b.depth),2.4,15.0);
  x.fillStyle=S.pitch.type.col;x.shadowColor='#ffffffaa';x.shadowBlur=8;
  x.beginPath();x.arc(b.x,b.y,radius,0,Math.PI*2);x.fill();x.shadowBlur=0
}
function draw(now){
  const d=dims();x.clearRect(0,0,d.w,d.h);drawField();drawZone();drawBall(now);
  if(S.input&&S.phase==='pitching'){
    const st=stats(now);x.strokeStyle='#87e9b2';x.lineWidth=2;x.setLineDash([5,4]);x.beginPath();x.arc(S.input.x,S.input.y,st.r,0,Math.PI*2);x.stroke();x.setLineDash([]);
    x.strokeStyle='#fff';x.beginPath();x.moveTo(S.input.x-7,S.input.y);x.lineTo(S.input.x+7,S.input.y);x.moveTo(S.input.x,S.input.y-7);x.lineTo(S.input.x,S.input.y+7);x.stroke();
    cm.style.width=Math.round((st.r-R0)/(R1-R0)*100)+'%';pm.style.width=Math.round(st.p*100)+'%'
  }else{cm.style.width='0%';pm.style.width='100%'}
  if(S.flash>0){x.globalAlpha=S.flash*.2;x.fillStyle='#fff4c2';x.fillRect(0,0,d.w,d.h);x.globalAlpha=1;S.flash*=.82}
}
function pitcher(a,b){
  const s=1.05;x.fillStyle='#d8dde2';x.fillRect(a-4*s,b-12*s,8*s,6*s);x.fillStyle='#3e4a57';x.fillRect(a-6*s,b-6*s,12*s,11*s);
  x.fillStyle='#d8dde2';x.fillRect(a-9*s,b-4*s,4*s,9*s);x.fillRect(a+5*s,b-4*s,4*s,9*s);x.fillStyle='#26313a';x.fillRect(a-5*s,b+5*s,4*s,9*s);x.fillRect(a+1*s,b+5*s,4*s,9*s)
}
function vibe(v){try{navigator.vibrate&&navigator.vibrate(v)}catch(e){}}
function tone(hit,pts){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!tone.a)tone.a=new A;const ac=tone.a,o=ac.createOscillator(),gain=ac.createGain();o.type=hit?'square':'sawtooth';o.frequency.value=hit?(pts>=100?220:150):90;gain.gain.value=.035;o.connect(gain);gain.connect(ac.destination);o.start();gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.12);o.stop(ac.currentTime+.13)}catch(e){}}
function loop(now){noSwing(now);x.save();if(S.shake>.2)x.translate(rand(-S.shake,S.shake),rand(-S.shake,S.shake));S.shake*=.82;draw(now);x.restore();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',down,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',up,{passive:false});c.addEventListener('pointercancel',up,{passive:false});
q('startBtn').onclick=begin;q('again').onclick=begin;addEventListener('resize',resize);resize();requestAnimationFrame(loop);
})();
</script>
</body></html>
