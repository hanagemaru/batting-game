<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BATTER'S READ — model playtest</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071017;color:#eef4f7;font-family:ui-monospace,monospace;touch-action:none}main{height:100dvh;display:grid;grid-template-rows:48px 1fr 58px;max-width:560px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #31404b;font-size:11px}canvas{width:100%;height:100%;display:block}.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px;border-top:1px solid #31404b}.meter{font-size:8px;color:#9eacb7}.track{height:7px;margin-top:5px;background:#15212a}.fill{height:100%;width:0;background:#8de7b1}.power{background:#f4d15d}.result{position:fixed;top:17%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;text-shadow:0 2px #000;pointer-events:none}.note{position:fixed;top:54px;left:50%;transform:translateX(-50%);font-size:8px;color:#9eacb7;white-space:nowrap;pointer-events:none}
</style></head><body><main><header><b>MODEL PLAYTEST</b><span id="info">FAST</span></header><canvas id="c"></canvas><div class="hud"><div class="meter">CONTACT<div class="track"><div id="contact" class="fill"></div></div></div><div class="meter">POWER<div class="track"><div id="power" class="fill power"></div></div></div></div></main><div class="note">RIGHT-HANDED BATTER POV · impact-biased view · 押して狙う → 待つほど広い / 弱い</div><div id="result" class="result"></div>
<script type="module">
import {PLATE_HALF,PLATE_FRONT,FLIGHT_MS,pitchPoint,projectFromBatter,strikeZoneCorners,homePlateVertices} from './pitch-model.js';
import {holdState,swingQuality,contactLabel} from './swing-model.js';
const c=document.querySelector('#c'),ctx=c.getContext('2d'),info=document.querySelector('#info'),res=document.querySelector('#result'),cm=document.querySelector('#contact'),pm=document.querySelector('#power');
let dpr=1,W=1,H=1,input=null,t0=performance.now(),pitch=null,locked=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
function resize(){const r=c.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(c);resize();
function makePitch(){const names=['FAST','FAST','FAST','CURVE','CURVE','FORK'],type=names[Math.floor(Math.random()*names.length)];return{type,release:{x:rand(.08,.28),y:rand(1.72,1.90),z:rand(16.55,17.05)},target:{x:rand(-PLATE_HALF+.04,PLATE_HALF-.04),y:rand(.56,1.12),z:PLATE_FRONT},dir:Math.random()<.5?-1:1,breakX:type==='CURVE'?rand(.18,.30):0,breakY:type==='FORK'?rand(.16,.23):type==='CURVE'?rand(.07,.13):.055}}
function next(){pitch=makePitch();t0=performance.now();locked=false;input=null;res.textContent='';info.textContent=pitch.type+' · '+FLIGHT_MS[pitch.type]+'ms'}next();
function projectedAt(u){const p=pitchPoint(pitch,u),q=projectFromBatter(p,W,H);return q&&{...q,u}}
function zone(){return strikeZoneCorners().map(p=>projectFromBatter(p,W,H))}
function plate(){return homePlateVertices().map(p=>projectFromBatter(p,W,H))}
function path(ps,close=false){const vs=ps.filter(Boolean);if(!vs.length)return;ctx.beginPath();ctx.moveTo(vs[0].x,vs[0].y);for(let i=1;i<vs.length;i++)ctx.lineTo(vs[i].x,vs[i].y);if(close)ctx.closePath()}
function draw(now){ctx.clearRect(0,0,W,H);const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#1b303c');grd.addColorStop(.44,'#101a20');grd.addColorStop(.45,'#274632');grd.addColorStop(1,'#182d22');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
 const hp=plate();ctx.fillStyle='#f4f1dfb8';ctx.strokeStyle='#ffffffb8';ctx.lineWidth=1.2;path(hp,true);ctx.fill();ctx.stroke();
 const z=zone();ctx.fillStyle='#ffffff06';ctx.strokeStyle='#ffffff72';ctx.lineWidth=1.4;path(z,true);ctx.fill();ctx.stroke();
 ctx.strokeStyle='#ffffff24';ctx.lineWidth=1;
 for(let i=1;i<3;i++){const a=i/3;
   const l={x:z[0].x+(z[3].x-z[0].x)*a,y:z[0].y+(z[3].y-z[0].y)*a},r={x:z[1].x+(z[2].x-z[1].x)*a,y:z[1].y+(z[2].y-z[1].y)*a};
   ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(r.x,r.y);ctx.stroke();
   const t={x:z[0].x+(z[1].x-z[0].x)*a,y:z[0].y+(z[1].y-z[0].y)*a},b={x:z[3].x+(z[2].x-z[3].x)*a,y:z[3].y+(z[2].y-z[3].y)*a};
   ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 }
 const elapsed=now-t0,u=elapsed/FLIGHT_MS[pitch.type];if(u<=1.12&&!locked){for(let i=6;i>=0;i--){const q=projectedAt(clamp(u-i*.018,0,1));if(!q)continue;ctx.globalAlpha=i?(.07*(7-i)):1;const r=clamp(110/q.depth,3,16);ctx.fillStyle=pitch.type==='CURVE'?'#a8ddff':pitch.type==='FORK'?'#ffd89b':'#fff';ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
 if(input&&!locked){const st=holdState(now-input.down);cm.style.width=(st.u*100)+'%';pm.style.width=(st.power*100)+'%';ctx.strokeStyle='#8de7b1';ctx.setLineDash([5,4]);ctx.beginPath();ctx.arc(input.x,input.y,st.contactRadius,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(input.x-7,input.y);ctx.lineTo(input.x+7,input.y);ctx.moveTo(input.x,input.y-7);ctx.lineTo(input.x,input.y+7);ctx.stroke()}else if(!locked){cm.style.width='0%';pm.style.width='100%'}
 if(u>1.12&&!locked){locked=true;res.textContent='TAKE';setTimeout(next,550)}requestAnimationFrame(draw)}requestAnimationFrame(draw);
c.addEventListener('pointerdown',e=>{if(locked||input)return;e.preventDefault();const r=c.getBoundingClientRect();input={id:e.pointerId,down:performance.now(),x:e.clientX-r.left,y:e.clientY-r.top};c.setPointerCapture?.(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!input||e.pointerId!==input.id)return;e.preventDefault();const r=c.getBoundingClientRect();input.x=clamp(e.clientX-r.left,0,W);input.y=clamp(e.clientY-r.top,0,H)});
c.addEventListener('pointerup',e=>{if(!input||e.pointerId!==input.id||locked)return;e.preventDefault();const now=performance.now(),u=(now-t0)/FLIGHT_MS[pitch.type],b=projectedAt(clamp(u,0,1));if(!b)return;const q=swingQuality({distancePx:Math.hypot(b.x-input.x,b.y-input.y),timingError:1-u,holdMs:now-input.down});const label=contactLabel(q.contactQuality);locked=true;res.textContent=label+' · PWR '+Math.round(q.power*100);cm.style.width='0%';pm.style.width=(q.power*100)+'%';setTimeout(next,650)});
</script></body></html>
