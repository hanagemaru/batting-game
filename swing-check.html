<!doctype html><meta charset="utf-8"><title>Swing model check</title><style>body{font:14px system-ui;background:#0b1015;color:#eaf0f5;padding:20px}pre{line-height:1.7}.ok{color:#8ff0b5}.bad{color:#ff8d8d}</style><h1>Swing model check</h1><pre id="out"></pre><script type="module">import{HOLD_MS,holdState,swingQuality}from'./swing-model.js';const rows=[];let ok=true,prevR=-Infinity,prevP=Infinity;for(let ms=0;ms<=HOLD_MS;ms+=50){const s=holdState(ms);if(s.contactRadius<prevR-1e-9||s.power>prevP+1e-9)ok=false;prevR=s.contactRadius;prevP=s.power;rows.push(`${String(ms).padStart(3)} ms  radius ${s.contactRadius.toFixed(1).padStart(4)} px  power ${(s.power*100).toFixed(0).padStart(3)}%`)}const quick=swingQuality({distancePx:18,timingError:.03,holdMs:0}),wait=swingQuality({distancePx:18,timingError:.03,holdMs:HOLD_MS});const assertions=[['contact radius only grows',ok],['full hold has lower power',wait.power<quick.power],['full hold has more spatial tolerance',wait.spatial>quick.spatial],['endpoints exact',Math.abs(holdState(0).power-1)<1e-9&&Math.abs(holdState(HOLD_MS).power-.34)<1e-9]];document.getElementById('out').innerHTML=assertions.map(([n,v])=>`<span class="${v?'ok':'bad'}">${v?'PASS':'FAIL'} ${n}</span>`).join('\n')+'\n\n'+rows.join('\n');</script>
